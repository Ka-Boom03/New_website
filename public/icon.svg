<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b0b0a; stroke: #ecebe6; stroke-opacity: 0.16; stroke-width: 2.5; }
      .initials {
        fill: #ecebe6;
        font-family: Georgia, 'Instrument Serif', 'Times New Roman', serif;
        font-style: italic;
        font-size: 74px;
        font-weight: normal;
      }
      .signal-dot {
        fill: #ff6a2b;
      }
      @media (prefers-color-scheme: light) {
        .bg { fill: #0b0b0a; stroke: rgba(0, 0, 0, 0.18); }
      }
    </style>
  </defs>
  <rect class="bg" x="3" y="3" width="186" height="186" rx="42" />
  <g transform="translate(96, 96)">
    <text class="initials" x="-10" y="24" text-anchor="middle" letter-spacing="-2">EM</text>
    <circle class="signal-dot" cx="48" cy="22" r="7.5" />
  </g>
</svg>
